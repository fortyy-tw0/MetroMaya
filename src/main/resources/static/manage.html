<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Appointment · Licensing &amp; Registration</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e9a820'/%3E%3Cpath d='M9 22V10h7a4 4 0 010 8h-4' fill='none' stroke='%2314213d' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">LR</span> Licensing &amp; Registration</a>
      <nav class="nav" aria-label="Main">
        <a href="/">Home</a>
        <a href="/book.html">Book</a>
        <a href="/manage.html" aria-current="page">My appointment</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="wrap" style="max-width: 760px;">
      <div class="page-title">
        <h1 style="font-size: clamp(1.8rem, 4vw, 2.6rem);">My appointment</h1>
        <p>Enter the reference number from your confirmation to view, reschedule or cancel.</p>
      </div>

      <div class="card">
        <form class="lookup" id="lookup-form">
          <div class="field">
            <label for="ref">Reference number</label>
            <input id="ref" name="ref" placeholder="APT-20261120-ABCDE" autocomplete="off" autocapitalize="characters" required>
          </div>
          <button class="btn btn-dark" type="submit">Find appointment</button>
        </form>
        <div class="alert alert-error" id="lookup-alert" hidden role="alert"></div>
      </div>

      <div class="card" id="result" style="margin-top: 1.5rem;" hidden>
        <div style="display:flex; justify-content:space-between; gap:1rem; align-items:center; flex-wrap:wrap;">
          <h2 style="margin:0;" id="result-ref"></h2>
          <span class="badge" id="result-status"></span>
        </div>
        <dl class="summary" id="result-summary"></dl>
        <h3>What to bring</h3>
        <div id="result-requirements"></div>
        <div class="alert alert-ok" id="result-alert" hidden role="status"></div>

        <div id="actions" class="no-print">
          <div class="nav-row" style="justify-content:flex-start;">
            <button class="btn btn-outline" id="reschedule-toggle">Reschedule</button>
            <button class="btn btn-danger" id="cancel-btn">Cancel appointment</button>
          </div>

          <div id="reschedule-box" hidden style="margin-top:1.25rem; padding-top:1.25rem; border-top:1px solid var(--line);">
            <h3>Choose a new date and time</h3>
            <div class="field" style="max-width:280px;">
              <label for="new-date">New date</label>
              <input type="date" id="new-date">
            </div>
            <div class="slots" id="new-slots" role="group" aria-label="Available times"></div>
            <div class="alert alert-error" id="new-slot-alert" hidden role="alert"></div>
            <div class="nav-row" style="justify-content:flex-start;">
              <button class="btn btn-primary" id="reschedule-confirm" disabled>Confirm new time</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap"><span>Licensing &amp; Registration Appointment System</span><span>OOP course project</span></div>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/manage.js"></script>
</body>
</html>
